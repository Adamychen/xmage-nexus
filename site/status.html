<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XMage Nexus — Estado del proyecto</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="status-page">
    <header class="topbar">
      <a class="brand" href="./index.html">
        <img src="./assets/logo.jpg" alt="XMage Nexus" class="brand-logo" />
        <span>XMage <b>Nexus</b></span>
      </a>
      <div class="meta">
        <span id="generated" class="muted"></span>
        <a id="commit" class="badge" href="#" target="_blank" rel="noopener">commit</a>
        <a id="repo" class="badge" href="#" target="_blank" rel="noopener">repo</a>
        <button type="button" class="badge" id="lang-toggle" aria-label="Change language">EN</button>
        <a id="back-link" class="badge" href="./index.html">← Inicio</a>
      </div>
    </header>

    <main id="status-dashboard" class="container">
      <h1 class="page-title" id="page-title">Estado del proyecto</h1>

      <section>
        <h2 id="h2-layers">Test &amp; CI Status</h2>
        <div id="layers" class="grid"></div>
      </section>

      <section>
        <h2 id="h2-coverage">Coverage</h2>
        <div id="coverage" class="grid"></div>
      </section>

      <section>
        <h2 id="h2-phases">Roadmap — Phases</h2>
        <div id="phases" class="grid"></div>
      </section>

      <section>
        <h2 id="h2-guards">Anti-Drift Guards</h2>
        <div id="guards" class="grid"></div>
      </section>

      <section>
        <h2><span id="h2-gaps">Engine&rarr;View Gaps</span> <span id="gaps-total" class="muted"></span></h2>
        <div class="scroll">
          <table id="gaps">
            <thead>
              <tr><th>Mechanic</th><th>Field</th><th>View</th><th>Status</th><th>Via</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section>
        <h2><span id="h2-reverse">Reverse-Drift Coverage</span> <span id="rev-total" class="muted"></span></h2>
        <div id="reverse" class="grid"></div>
      </section>

      <section>
        <h2 id="h2-features">Feature Parity Matrix</h2>
        <div class="scroll">
          <table id="features">
            <thead>
              <tr><th>Category</th><th>Feature</th><th>Official XMage</th><th>XMage Nexus</th><th>Phase</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <footer class="footer-note muted">
        <span id="stack"></span>
      </footer>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
