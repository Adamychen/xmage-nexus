name: Launcher modules (jre+server+proxy)

# F0 (Nexus Launcher): construye por SO los módulos que el instalador ligero
# descarga en el primer arranque. Todo lo Java se construye aquí, nunca en local.
# El smoke de arranque en modo normal llega en F1/F3.

on:
  workflow_dispatch: {}
  push:
    branches: ["master", "main"]
    paths:
      - 'Mage.Common/**'
      - 'Mage/**'
      - 'Mage.Sets/**'
      - 'Mage.Server/**'
      - 'Mage.Server.Plugins/**'
      - 'Mage.Proxy/**'
      - 'pom.xml'
      - 'scripts/build.mjs'
      - 'scripts/lib.mjs'
      - 'scripts/assemble-modules.mjs'
      - '.github/workflows/modules.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tag: linux-x64
          - os: windows-latest
            tag: win-x64
          - os: macos-latest
            tag: mac-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build base modules
        run: mvn -B -q -pl Mage.Common,Mage,Mage.Sets,Mage.Server -am install -DskipTests
      - name: Build plugins
        run: mvn -B -q -pl Mage.Server.Plugins/Mage.Player.AI,Mage.Server.Plugins/Mage.Player.AI.MAD,Mage.Server.Plugins/Mage.Player.AI.DraftBot,Mage.Server.Plugins/Mage.Player.Human,Mage.Server.Plugins/Mage.Game.TwoPlayerDuel,Mage.Server.Plugins/Mage.Deck.Constructed install -DskipTests
      - name: Package proxy
        run: mvn -B -q -pl Mage.Proxy clean package -DskipTests
      - name: Assemble staging
        run: node scripts/assemble-modules.mjs staging
      - name: Build stripped JRE (jlink)
        run: |
          MODULES=$(jdeps --ignore-missing-deps --multi-release 17 --print-module-deps \
            --class-path 'staging/server/lib/*' \
            staging/proxy/mage-proxy-*.jar staging/server/classes/*/)
          echo "modules: $MODULES"
          jlink --add-modules "$MODULES" --strip-debug --no-man-pages --no-header-files \
            --compress=2 --output staging/jre
      - name: Sanity check
        run: |
          test -f staging/version.json
          ls staging/proxy/
          test -x staging/jre/bin/java || test -f staging/jre/bin/java.exe
          staging/jre/bin/java -version
          du -sh staging staging/jre
      - name: Smoke server (normal mode) + proxy
        run: |
          SEP=':'
          if [[ "$RUNNER_OS" == 'Windows' ]]; then SEP=';'; fi
          SERVER_CP="classes/Mage${SEP}classes/Mage.Common${SEP}classes/Mage.Sets${SEP}classes/Mage.Server${SEP}classes/Mage.Player.AI${SEP}lib/*"
          PROXY_JAR=(staging/proxy/mage-proxy-*.jar)
          wait_port() {
            for _ in $(seq 1 60); do
              if (echo > /dev/tcp/127.0.0.1/$1) 2>/dev/null; then return 0; fi
              sleep 5
            done
            return 1
          }
          ROOT="$PWD"
          SMOKE=$(mktemp -d)
          cp -r staging/server "$SMOKE/server"
          perl -pi -e 's/port="17171"/port="17371"/' "$SMOKE/server/config/config.xml"
          mkdir -p "$SMOKE/server/saved" "$SMOKE/server/gamesHistory"
          (cd "$SMOKE/server" && "$ROOT/staging/jre/bin/java" -Dxmage.testMode=false \
            --add-opens=java.base/java.io=ALL-UNNAMED \
            --add-opens=java.base/java.util=ALL-UNNAMED \
            --add-opens=java.base/java.lang=ALL-UNNAMED \
            --add-opens=java.base/java.lang.reflect=ALL-UNNAMED \
            --add-opens=java.base/java.text=ALL-UNNAMED \
            -cp "$SERVER_CP" \
            mage.server.Main > "$SMOKE/server.log" 2>&1 & echo $! > "$SMOKE/server.pid")
          ("$ROOT/staging/jre/bin/java" -cp "$ROOT/${PROXY_JAR}" org.mage.proxy.Main \
            --wsPort 18887 --httpPort 18888 > "$SMOKE/proxy.log" 2>&1 & echo $! > "$SMOKE/proxy.pid")
          wait_port 17371 || (echo '--- server.log'; tail -20 "$SMOKE/server.log"; exit 1)
          wait_port 18888 || (echo '--- proxy.log'; tail -20 "$SMOKE/proxy.log"; exit 1)
          curl -sf --max-time 10 http://127.0.0.1:18888/index.html -o /dev/null
          grep -q 'Started MAGE server' "$SMOKE/server.log"
          if grep -q 'running in test mode' "$SMOKE/server.log"; then echo 'server en test mode, se esperaba normal'; exit 1; fi
          echo 'smoke OK: servidor normal en 17371 + proxy en 18887/18888'
          kill "$(cat "$SMOKE/server.pid")" "$(cat "$SMOKE/proxy.pid")" 2>/dev/null || true
          sleep 3
          kill -9 "$(cat "$SMOKE/server.pid")" "$(cat "$SMOKE/proxy.pid")" 2>/dev/null || true
      - name: Pack component tarballs
        run: |
          export COPYFILE_DISABLE=1
          tar -czf nexus-jre-${{ matrix.tag }}.tar.gz -C staging/jre .
          tar -czf nexus-server-${{ matrix.tag }}.tar.gz -C staging/server .
          tar -czf nexus-proxy-${{ matrix.tag }}.tar.gz -C staging/proxy .
      - name: Verify component layout
        run: |
          rm -rf /tmp/layout && mkdir -p /tmp/layout/server /tmp/layout/proxy /tmp/layout/jre
          tar -xzf nexus-server-${{ matrix.tag }}.tar.gz -C /tmp/layout/server
          tar -xzf nexus-proxy-${{ matrix.tag }}.tar.gz -C /tmp/layout/proxy
          tar -xzf nexus-jre-${{ matrix.tag }}.tar.gz -C /tmp/layout/jre
          test -f /tmp/layout/server/version.json
          test -d /tmp/layout/server/classes/Mage.Sets
          test -f /tmp/layout/server/config/config.xml
          ls /tmp/layout/proxy/mage-proxy-*.jar
          test -x /tmp/layout/jre/bin/java || test -f /tmp/layout/jre/bin/java.exe
      - name: Upload modules
        uses: actions/upload-artifact@v4
        with:
          name: nexus-modules-${{ matrix.tag }}
          path: |
            nexus-jre-${{ matrix.tag }}.tar.gz
            nexus-server-${{ matrix.tag }}.tar.gz
            nexus-proxy-${{ matrix.tag }}.tar.gz
          retention-days: 30
