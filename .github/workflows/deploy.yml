name: deploy

# Despliega en el servidor propio (runner self-hosted) SOLO cuando alguien con
# permiso de escritura lo lanza a mano: Actions > deploy > Run workflow, o
# `gh workflow run deploy.yml --ref master`.
# SEGURIDAD: este runner ejecuta código en el servidor. Mantener solo
# workflow_dispatch. NUNCA añadir push / pull_request / pull_request_target.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, xmage-nexus]
    timeout-minutes: 30
    steps:
      - name: Build (pull, proxy, web)
        run: ~/deploy-xmage.sh
      - name: Restart proxy
        run: sudo -n /usr/bin/systemctl restart xmage-proxy.service
      - name: Check service is up
        run: |
          sleep 3
          systemctl is-active xmage-proxy.service
