name: deploy-dev

# Publishes the web client of any branch to https://dev.xmage-nexus.com so a change
# can be tried in a real browser against the real proxy and beta.xmage.today before
# it reaches players. Dispatch-only: a job on the self-hosted runner must never be
# reachable from a pull request (same rule as deploy.yml).
#
# What it touches: the runner workspace, ~/xmage-dev-dist and the user unit
# xmage-dev-web.service. It never runs ~/deploy-xmage.sh, never builds or restarts
# the proxy, and never needs sudo. Production keeps running the build of master.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to build (default master)
        required: true
        default: master
        type: string

permissions:
  contents: read

# Unlike production, a superseded preview is disposable: the newest dispatch wins.
concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, xmage-nexus]
    timeout-minutes: 20
    permissions:
      contents: read
    # The dev page talks to the same proxy and server players use, so the branch only
    # changes the client. A branch that changes Mage.Proxy needs its own stack.
    env:
      VITE_DEFAULT_PROXY_HOST: wss://ws.xmage-nexus.com
      VITE_DEFAULT_PROXY_PORT: "443"
      VITE_DEFAULT_XDHS_PROXY_HOST: wss://xdhs.xmage-nexus.com
      VITE_DEFAULT_XDHS_PROXY_PORT: "443"
      VITE_DEFAULT_SERVER_HOST: beta.xmage.today
      VITE_DEFAULT_SERVER_PORT: "17171"
    steps:
      - name: Validate the requested ref
        env:
          REF: ${{ inputs.ref }}
        run: |
          if ! printf '%s' "$REF" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]*$' || printf '%s' "$REF" | grep -q '\.\.'; then
            echo "::error::$REF is not a valid branch or tag name"
            exit 1
          fi
          if ! git ls-remote --exit-code --heads --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$REF" >/dev/null; then
            echo "::error::$REF is not a branch or tag of $GITHUB_REPOSITORY"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Build the web client of the branch
        run: |
          # The runner's PATH has node but no npm: the toolchain lives in nvm, like
          # ~/deploy-xmage.sh assumes.
          if [ -s "$HOME/.nvm/nvm.sh" ]; then . "$HOME/.nvm/nvm.sh"; fi
          node -v
          npm -v
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web run build

      - name: Publish to the dev site
        run: |
          dest="$HOME/xmage-dev-dist"
          mkdir -p "$dest"
          rsync -a --delete web/dist/ "$dest/"
          # Public data, generated by the host's timer into the production dist.
          if [ -f "$HOME/Escritorio/xmage-nexus/web/dist/ranking.json" ]; then
            cp -f "$HOME/Escritorio/xmage-nexus/web/dist/ranking.json" "$dest/ranking.json"
          fi
          # The commit that was actually built, not github.sha: a dispatch can be sent
          # from master while asking for another branch.
          SHA=$(git rev-parse HEAD)
          export SHA REF="$REF_INPUT" ACTOR="$GITHUB_ACTOR" \
            RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          node -e '
            const fs = require("node:fs");
            const sha = process.env.SHA;
            const info = {
              ref: process.env.REF,
              sha,
              shortSha: sha.slice(0, 7),
              builtAt: new Date().toISOString(),
              actor: process.env.ACTOR,
              runUrl: process.env.RUN_URL,
            };
            fs.writeFileSync(process.argv[1], JSON.stringify(info, null, 2) + "\n");
          ' "$dest/dev-info.json"
        env:
          REF_INPUT: ${{ inputs.ref }}

      - name: Restart the dev web server
        run: systemctl --user restart xmage-dev-web.service

      - name: Summary
        run: |
          echo "### dev.xmage-nexus.com" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- ref: \`${{ inputs.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`$(git rev-parse --short HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- url: https://dev.xmage-nexus.com" >> "$GITHUB_STEP_SUMMARY"
