name: Web client CI (web)

on:
  push:
    paths:
      - 'web/**'
      - 'mcp/**'
      - 'Mage.Proxy/**'
      - 'scripts/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'mcp/**'
      - 'Mage.Proxy/**'
      - 'scripts/**'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      NEXUS_FORK_DIR: ${{ github.workspace }}/xmage-fork
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: nexus
          path: xmage-fork
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        working-directory: web
        run: npm ci
      - name: Validate generated zod schema is in sync with contract
        working-directory: web
        run: npm run gen-zod:validate
      - name: Validate generated TS types are in sync with contract
        working-directory: web
        run: npm run gen-types:validate
      - name: Validate server-state schema is in sync with config.xml
        working-directory: web
        run: npm run gen-server-state:validate
      - name: Unit tests (vitest)
        working-directory: web
        run: npm run test
      - name: Coverage gate (vitest)
        working-directory: web
        run: npm run test:coverage
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Build
        working-directory: web
        run: npm run build

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mcp/package-lock.json
      - name: npm ci (web, para web/fixtures/fake.ts)
        working-directory: web
        run: npm ci
      - name: npm ci (mcp)
        working-directory: mcp
        run: npm ci
      - name: Typecheck
        working-directory: mcp
        run: npm run typecheck
      - name: Tests (FixtureServer, sin Java)
        working-directory: mcp
        run: npm test

  proxy:
    runs-on: ubuntu-latest
    env:
      NEXUS_FORK_DIR: ${{ github.workspace }}/xmage-fork
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: nexus
          path: xmage-fork
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Maven proxy tests (installs org.mage artifacts from the fork checkout)
        run: node scripts/test.mjs java
      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mage-proxy-surefire
          path: Mage.Proxy/target/surefire-reports/**

  integration:
    runs-on: ubuntu-latest
    needs: [web, proxy]
    env:
      NEXUS_FORK_DIR: ${{ github.workspace }}/xmage-fork
      # primer run con caché frío: el escaneo de cartas del proxy puede tardar
      # ~15 min en el runner; warmup sondea connect hasta que el proxy está READY
      NEXUS_PROXY_WARMUP_MS: '1200000'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: nexus
          path: xmage-fork
          fetch-depth: 1
        id: fork
      - name: Cache XMage server card DB (avoid full cold scan)
        uses: actions/cache@v4
        with:
          path: local-server/db
          key: xmage-db-${{ steps.fork.outputs.commit }}
      - name: Cache XMage proxy card DB (avoid proxy cold scan)
        uses: actions/cache@v4
        with:
          path: Mage.Proxy/db
          key: xmage-proxy-db-${{ steps.fork.outputs.commit }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        working-directory: web
        run: npm ci
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Build server, plugins and proxy
        run: node scripts/build.mjs
      - name: Start local stack
        run: node scripts/dev.mjs start
      - name: Run real self-tests and browser E2E
        run: node scripts/test.mjs self-test human-test e2e
      - name: Stop local stack
        if: always()
        run: node scripts/dev.mjs stop
      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mage-proxy-integration-logs
          path: |
            .run/*.log
            web/test-results/**
            web/playwright-report/**
          if-no-files-found: ignore
