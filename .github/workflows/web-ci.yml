name: Web client CI (web)

on:
  # master only. A push to a branch that has a PR used to start a second, parallel run of this
  # whole workflow: push and pull_request land in different concurrency groups (refs/heads/x vs
  # refs/pull/N/merge), so neither cancelled the other and both ran to the end. The pull_request
  # run covers the same branch, and it tests the merge. A branch with no PR yet gets no run until
  # the PR is opened, which is also how upstream-upgrade's upgrade/xmage_* branch is covered (the
  # draft PR it opens triggers this workflow, and the fork-ref step reads GITHUB_HEAD_REF there).
  # Tags stop triggering it too: a release tag points at a master commit that already ran this.
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'mcp/**'
      - 'Mage.Proxy/**'
      - 'scripts/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'mcp/**'
      - 'Mage.Proxy/**'
      - 'scripts/**'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXUS_FORK_DIR: ${{ github.workspace }}/xmage-fork
    steps:
      - uses: actions/checkout@v6
      - name: Pick the fork branch (an upgrade/xmage_* branch builds against its nexus-upgrade/xmage_* fork branch)
        id: fork-ref
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          case "$branch" in
            upgrade/xmage_*) echo "ref=nexus-upgrade/${branch#upgrade/}" >> "$GITHUB_OUTPUT" ;;
            *) echo "ref=nexus" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.fork-ref.outputs.ref }}
          path: xmage-fork
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        working-directory: web
        run: npm ci
      - name: Validate generated zod schema is in sync with contract
        working-directory: web
        run: npm run gen-zod:validate
      - name: Validate generated TS types are in sync with contract
        working-directory: web
        run: npm run gen-types:validate
      - name: Validate server-state schema is in sync with config.xml
        working-directory: web
        run: npm run gen-server-state:validate
      # fails on errors (rules of hooks, correctness, `any` in shipped code); the effect-deps warning debt is ratcheted by src/lintRatchet.test.ts
      - name: Lint (oxlint)
        working-directory: web
        run: npm run lint
      - name: Unit tests + coverage gate (vitest)
        working-directory: web
        run: npm run test:coverage
      - name: Enforce coverage no-regression gate (TST-6)
        run: node -e "import('./scripts/coverage-gate.mjs').then(m => { const r = m.enforceCoverageGate(); console.log(r.message); if (!r.ok) process.exit(1); })"
      - name: Scripts unit tests (node --test, dashboard and CI helpers)
        run: node --test scripts/*.test.mjs
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Build
        working-directory: web
        run: npm run build
      - name: Bundle size budget
        working-directory: web
        run: npm run check:bundle

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_AUDIT_VERSION: 0.23.0
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: npm audit (web, shipped dependencies)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (mcp, shipped dependencies)
        working-directory: mcp
        run: npm audit --omit=dev --audit-level=high
      # cargo-audit used to be compiled from source on every run (~2.6 min of the job's 2.9).
      # The binary is cached per version; the advisory database is still fetched fresh by `cargo audit`.
      - name: Cache the cargo-audit binary
        id: cargo-audit-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ env.CARGO_AUDIT_VERSION }}
      - name: Install cargo-audit (cache miss)
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version ${{ env.CARGO_AUDIT_VERSION }}
      - name: cargo audit (launcher)
        working-directory: launcher
        run: cargo audit

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mcp/package-lock.json
      - name: npm ci (web, for web/fixtures/fake.ts)
        working-directory: web
        run: npm ci
      - name: npm ci (mcp)
        working-directory: mcp
        run: npm ci
      - name: Typecheck
        working-directory: mcp
        run: npm run typecheck
      - name: Tests (FixtureServer, no Java)
        working-directory: mcp
        run: npm test

  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXUS_FORK_DIR: ${{ github.workspace }}/xmage-fork
    steps:
      - uses: actions/checkout@v6
      - name: Pick the fork branch (an upgrade/xmage_* branch builds against its nexus-upgrade/xmage_* fork branch)
        id: fork-ref
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          case "$branch" in
            upgrade/xmage_*) echo "ref=nexus-upgrade/${branch#upgrade/}" >> "$GITHUB_OUTPUT" ;;
            *) echo "ref=nexus" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.fork-ref.outputs.ref }}
          path: xmage-fork
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Maven proxy tests (installs org.mage artifacts from the fork checkout)
        run: node scripts/test.mjs java
      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mage-proxy-surefire
          path: Mage.Proxy/target/surefire-reports/**

  e2e-fake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        working-directory: web
        run: npm ci
      - name: Read the installed Playwright version
        id: pw
        working-directory: web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright chromium (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: |
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "::warning::Playwright browser download failed (attempt $attempt), retrying"
            sleep 20
          done
          exit 1
      - name: Install Playwright system dependencies (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chromium
      - name: Browser E2E (fake, FixtureServer, no Java/stack), shard ${{ matrix.shard }}/6
        working-directory: web
        env:
          E2E_LANE: light
        run: npx playwright test --shard=${{ matrix.shard }}/6 --grep-invert @timing
      - name: Upload fake-e2e results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mage-fake-e2e-results-shard-${{ matrix.shard }}
          path: |
            web/test-results/**
            web/playwright-report/**
          if-no-files-found: ignore

  # The heavy half of the fake suite (HEAVY_SPECS in web/playwright.config.ts). Playwright balances
  # shards by test count, so board-settle and band-fit-classic, alphabetical neighbours that cost
  # far more per test than the rest, kept landing on the same shard: 50.3 min of work against
  # 20-23 for the other five, and 17.6 min of wall clock against 7.4-9.1. They get their own two
  # shards instead, and e2e-fake runs the rest.
  e2e-fake-heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        working-directory: web
        run: npm ci
      - name: Read the installed Playwright version
        id: pw
        working-directory: web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright chromium (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: |
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "::warning::Playwright browser download failed (attempt $attempt), retrying"
            sleep 20
          done
          exit 1
      - name: Install Playwright system dependencies (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chromium
      - name: Browser E2E (fake, the heavy specs), shard ${{ matrix.shard }}/2
        working-directory: web
        env:
          E2E_LANE: heavy
        run: npx playwright test --shard=${{ matrix.shard }}/2 --grep-invert @timing
      - name: Upload heavy-e2e results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mage-fake-heavy-e2e-results-shard-${{ matrix.shard }}
          path: |
            web/test-results/**
            web/playwright-report/**
          if-no-files-found: ignore

  e2e-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        working-directory: web
        run: npm ci
      - name: Read the installed Playwright version
        id: pw
        working-directory: web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright chromium (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: |
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "::warning::Playwright browser download failed (attempt $attempt), retrying"
            sleep 20
          done
          exit 1
      - name: Install Playwright system dependencies (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chromium
      - name: Browser E2E (fake, timing-sensitive specs)
        working-directory: web
        run: npx playwright test --grep @timing
      - name: Upload timing e2e results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mage-timing-e2e-results
          path: |
            web/test-results/**
            web/playwright-report/**
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    # generous: a cold cache makes the proxy's card scan take ~15 min and NEXUS_PROXY_WARMUP_MS waits 20
    timeout-minutes: 45
    # No needs. This job checks out the fork itself, builds the engine and the proxy with
    # scripts/build.mjs (ensureMageArtifacts installs org.mage from the fork checkout when ~/.m2
    # is missing them or stamped at another commit) and reads nothing from web or proxy, so the
    # wait bought nothing but a cheaper red: it skipped this job when the basics failed. On run
    # 43455026794 it took 8.0 min of work and finished at 12.4 min because it waited 4.5 for web,
    # which made it the critical path of a run whose e2e was done at 9.4. Runner minutes are free
    # on a public repo and web or proxy fail in about one run of ten, so the trade is backwards.
    env:
      NEXUS_FORK_DIR: ${{ github.workspace }}/xmage-fork
      # first run with a cold cache: the proxy's card scan can take
      # ~15 min on the runner; warmup polls connect until the proxy is READY
      NEXUS_PROXY_WARMUP_MS: '1200000'
    steps:
      - uses: actions/checkout@v6
      - name: Pick the fork branch (an upgrade/xmage_* branch builds against its nexus-upgrade/xmage_* fork branch)
        id: fork-ref
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          case "$branch" in
            upgrade/xmage_*) echo "ref=nexus-upgrade/${branch#upgrade/}" >> "$GITHUB_OUTPUT" ;;
            *) echo "ref=nexus" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.fork-ref.outputs.ref }}
          path: xmage-fork
          fetch-depth: 1
        id: fork
      - name: Cache XMage server card DB (avoid full cold scan)
        uses: actions/cache@v4
        with:
          path: local-server/db
          key: xmage-db-${{ steps.fork.outputs.commit }}
      - name: Cache XMage proxy card DB (avoid proxy cold scan)
        uses: actions/cache@v4
        with:
          path: Mage.Proxy/db
          key: xmage-proxy-db-${{ steps.fork.outputs.commit }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        working-directory: web
        run: npm ci
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Build server, plugins and proxy
        run: node scripts/build.mjs
      - name: Start local stack
        run: node scripts/dev.mjs start
      - name: Run stack self-tests (headless + human, with local stack)
        run: node scripts/test.mjs self-test human-test
      - name: Run anti-drift verify suite (multi-tenant, permissions, tournaments…)
        run: node scripts/test.mjs verify
      - name: Stop local stack
        if: always()
        run: node scripts/dev.mjs stop
      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mage-proxy-integration-logs
          path: |
            .run/*.log
            web/test-results/**
            web/playwright-report/**
          if-no-files-found: ignore
          # .run/ is a hidden dir: upload-artifact@v4 skips it unless asked
          include-hidden-files: true
