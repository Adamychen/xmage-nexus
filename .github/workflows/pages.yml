name: Dashboard Pages

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - "Mage.Proxy/**"
      - "scripts/**"
      - "site/**"
      - ".github/workflows/pages.yml"
  schedule:
    # Nightly: also runs the integration suite against the real stack.
    - cron: "23 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Without this, a zombie runner (e.g. a hung 'Install Playwright browsers') blocks
    # the pages-* queue forever: cancel-in-progress is false.
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      NEXUS_FORK_DIR: ${{ github.workspace }}/xmage-fork
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          ref: nexus
          path: xmage-fork
          fetch-depth: 1
        id: fork
      - name: Cache XMage server card DB (nightly stack boot)
        uses: actions/cache@v4
        with:
          path: local-server/db
          key: xmage-db-${{ steps.fork.outputs.commit }}

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mcp/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: npm ci (mcp)
        working-directory: mcp
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Generate dashboard (lightweight layers)
        env:
          # On push the fake e2e is skipped here: web-ci.yml runs the same suite sharded on every push,
          # and this workflow runs it nightly / on demand. The layer is reported as pending, not failed.
          DASHBOARD_SKIP_E2E: ${{ github.event_name == 'push' && '1' || '' }}
          # The runner is much slower than a dev machine, so the fake e2e takes several times longer there;
          # fewer parallel Chromiums keep the timing-sensitive specs (flights, latency, combat strikes) off a starved CPU.
          E2E_WORKERS: "2"
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/dashboard-ci.mjs

      - name: Build stack (nightly only)
        if: github.event_name == 'schedule'
        run: node scripts/build.mjs

      - name: Start local stack (nightly only)
        if: github.event_name == 'schedule'
        run: node scripts/dev.mjs start

      - name: Integration (real stack, nightly only)
        if: github.event_name == 'schedule'
        run: node scripts/integration-report.mjs

      - name: Re-record golden frames (nightly only)
        if: github.event_name == 'schedule'
        run: node scripts/record.mjs all

      - name: Validate re-recorded frames (nightly only)
        if: github.event_name == 'schedule'
        working-directory: web
        run: npx vitest run fixtures/recorded.test.ts

      - name: Stop local stack (nightly only)
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: node scripts/dev.mjs stop

      - name: Upload nightly integration report (nightly only)
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: nightly-integration-report
          path: |
            reports/integration-result.json
            web/playwright-report/**
            web/test-results/**
            web/fixtures/recorded/*.json
          if-no-files-found: warn

      - name: Regenerate with integration results (nightly only)
        if: github.event_name == 'schedule'
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/gen-dashboard.mjs

      - name: Build the interactive demo
        working-directory: web
        run: npm run build:demo

      - name: Verify the demo (tour + every scenario)
        id: verify-demo
        continue-on-error: true
        run: node scripts/verify-demo.mjs web/dist-demo

      - name: Regenerate status.json with demo results
        env:
          # Same skip semantics as the dashboard generation step: on push the fake e2e ran in
          # web-ci.yml, so the regenerated layer must stay pending, not fail for a missing report.
          DASHBOARD_SKIP_E2E: ${{ github.event_name == 'push' && '1' || '' }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/gen-dashboard.mjs

      # A broken demo is never published, but it must not block the status page either:
      # the run is failed at the very end, after the deploy.
      - name: Publish the demo under site/demo
        if: steps.verify-demo.outcome == 'success'
        run: cp -R web/dist-demo site/demo

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # After the deploy, on purpose: the status page must publish the truth (red layers and all)
      # and the run must be red with it. See scripts/check-status.mjs.
      - name: Fail the run on red layers
        run: node scripts/check-status.mjs

      - name: Fail the run if the demo is broken
        if: always() && steps.verify-demo.outcome == 'failure'
        run: |
          echo "::error::The interactive demo failed verification and was not published"
          exit 1
