name: Dashboard Pages

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - "Mage.Proxy/**"
      - "scripts/**"
      - "site/**"
      - ".github/workflows/pages.yml"
  schedule:
    # Nightly: also runs the integration suite against the real stack.
    - cron: "23 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Without this, a zombie runner (e.g. a hung 'Install Playwright browsers') blocks
    # the pages-* queue forever: cancel-in-progress is false.
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      NEXUS_FORK_DIR: ${{ github.workspace }}/xmage-fork
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          ref: nexus
          path: xmage-fork
          fetch-depth: 1
        id: fork
      - name: Cache XMage server card DB (nightly stack boot)
        uses: actions/cache@v4
        with:
          path: local-server/db
          key: xmage-db-${{ steps.fork.outputs.commit }}

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mcp/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: npm ci (mcp)
        working-directory: mcp
        run: npm ci

      # Same cache as web-ci.yml: the uncached download is usually under a minute, but it is the
      # step that hung for 89 min on 2026-10-31 and blocked the pages-* queue (cancel-in-progress
      # is false here).
      - name: Read the installed Playwright version
        id: pw
        working-directory: web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright chromium (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: |
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "::warning::Playwright browser download failed (attempt $attempt), retrying"
            sleep 20
          done
          exit 1

      - name: Install Playwright system dependencies (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chromium

      - name: Generate dashboard (lightweight layers)
        env:
          # On push the fake e2e is skipped here: web-ci.yml runs the same suite sharded on master,
          # and this workflow runs it nightly / on demand. The layer is reported as pending, not failed.
          DASHBOARD_SKIP_E2E: ${{ github.event_name == 'push' && '1' || '' }}
          # The runner is much slower than a dev machine, so the fake e2e takes several times longer there;
          # fewer parallel Chromiums keep the timing-sensitive specs (flights, latency, combat strikes) off a starved CPU.
          E2E_WORKERS: "2"
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/dashboard-ci.mjs

      - name: Build stack (nightly only)
        if: github.event_name == 'schedule'
        run: node scripts/build.mjs

      - name: Start local stack (nightly only)
        if: github.event_name == 'schedule'
        run: node scripts/dev.mjs start

      # No continue-on-error here: TST-4 says a failed integration layer is a red run, and
      # scripts/workflows.test.mjs guards it. What changes is downstream: the publishing steps
      # below carry !cancelled(), so a red layer no longer takes the deploy down with it.
      - name: Integration (real stack, nightly only)
        if: github.event_name == 'schedule'
        run: node scripts/integration-report.mjs

      - name: Re-record golden frames (nightly only)
        if: github.event_name == 'schedule'
        run: node scripts/record.mjs all

      - name: Validate re-recorded frames (nightly only)
        if: github.event_name == 'schedule'
        working-directory: web
        run: npx vitest run fixtures/recorded.test.ts

      - name: Stop local stack (nightly only)
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: node scripts/dev.mjs stop

      - name: Upload nightly integration report (nightly only)
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-integration-report
          path: |
            reports/integration-result.json
            web/playwright-report/**
            web/test-results/**
            web/fixtures/recorded/*.json
          if-no-files-found: warn

      - name: Regenerate with integration results (nightly only)
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/gen-dashboard.mjs

      # !cancelled(), so a failed nightly step still publishes what the dashboard has. Publishing
      # the truth is the point and the run stays red either way (the failed step is still a
      # failure, and check-status.mjs fails on red layers). Before this, a red integration skipped
      # the deploy with it: 27 of the last 31 nightlies published no dashboard at all.
      - name: Upload Pages artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        if: ${{ !cancelled() }}
        uses: actions/deploy-pages@v4

      # After the deploy, on purpose: the status page must publish the truth (red layers and all)
      # and the run must be red with it. See scripts/check-status.mjs.
      - name: Fail the run on red layers
        if: ${{ !cancelled() }}
        run: node scripts/check-status.mjs
