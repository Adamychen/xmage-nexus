[workspace]
members = [".", "src-tauri"]

[package]
name = "nexus-launcher"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nexus-bootstrap"
path = "src/main.rs"

[lib]
name = "nexus_launcher"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
